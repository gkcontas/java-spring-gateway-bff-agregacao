services:

  # One WireMock plays the three downstream services (users, orders, catalog)
  # and the recommendations service, each under its own path prefix. Delays
  # and faults are changed at runtime through the admin API.
  downstream:
    image: wiremock/wiremock:3.9.2
    # 8089 is free on this machine; the user's own containers publish 27017,
    # 8083 and 4873. The gateway itself listens on 8080.
    ports:
      - "8089:8080"
    command: ["--global-response-templating", "--disable-banner", "--async-response-enabled=true", "--container-threads=200"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
